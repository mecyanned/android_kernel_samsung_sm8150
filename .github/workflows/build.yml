- name: "Set up build environment"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev make libncurses-dev git curl clang lld \
            libelf-dev erofs-utils android-sdk-libsparse-utils automake autoconf libtool pkg-config fuse3 e2fsprogs pv liblz4-dev uuid-dev \
            libfuse3-dev f2fs-tools fuse2fs attr zlib1g-dev rsync \
            device-tree-compiler lz4 xz-utils openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full \
            cpio zip unzip kmod openssl python3-pip
          
          # Fix: Fetch libtinfo5 from Ubuntu 22.04 (Jammy) pool
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb 
          sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb
          sudo apt-get install -f -y
